<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CLASS TEN_ELEVEN</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,Arial;background:#070b14;color:#f5f8ff}
a{color:inherit;text-decoration:none}.wrap{width:min(1120px,92%);margin:auto}
nav{position:sticky;top:0;z-index:5;background:rgba(7,11,20,.82);backdrop-filter:blur(14px);border-bottom:1px solid #ffffff16}
.nav{height:68px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;letter-spacing:1px}.logo b{color:#4da3ff}
button,.btn{border:0;border-radius:11px;padding:11px 15px;font-weight:800;cursor:pointer;background:#152238;color:#fff}
.primary{background:#4da3ff;color:#06101d}.danger{background:#3a1720}.muted{color:#9ca9bf}
main{padding:55px 0}.hero{padding:55px 0 80px}.pill{display:inline-block;padding:7px 11px;border:1px solid #4da3ff55;border-radius:999px;color:#77c7ff;font-size:12px;font-weight:800}
h1{font-size:clamp(3rem,9vw,7rem);line-height:.88;letter-spacing:-5px;margin:20px 0}h1 span{color:#4da3ff}h2{font-size:2.2rem;letter-spacing:-2px}.hero p{max-width:650px;color:#9ca9bf;font-size:1.08rem}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{background:#0d1422;border:1px solid #ffffff10;border-radius:19px;padding:22px}.card h3{margin:0 0 8px}.card p{color:#9ca9bf}
section{padding:60px 0}.sectiontop{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:25px}
table{width:100%;border-collapse:collapse}.table{overflow:auto;background:#0d1422;border:1px solid #ffffff10;border-radius:18px}th,td{text-align:left;padding:14px;border-bottom:1px solid #ffffff0d;white-space:nowrap}th{color:#77c7ff}
.gallery{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.gallery img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:15px}
.hidden{display:none!important}.auth{min-height:75vh;display:grid;place-items:center}.authbox{width:min(430px,100%);background:#0d1422;border:1px solid #ffffff12;border-radius:22px;padding:28px}
input,textarea{width:100%;background:#080e19;border:1px solid #ffffff15;color:#fff;padding:12px;border-radius:10px;margin:7px 0 13px;font:inherit}textarea{min-height:100px;resize:vertical}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px}.tabs button.active{background:#4da3ff;color:#06101d}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between}.actions{display:flex;gap:8px;flex-wrap:wrap}
.notice{padding:13px;border-radius:11px;background:#172338;color:#cfe5ff;margin:10px 0}.err{color:#ff9ca8}
footer{border-top:1px solid #ffffff10;padding:30px 0;color:#75839a}
@media(max-width:760px){.grid,.gallery{grid-template-columns:1fr}.sectiontop{display:block}h1{letter-spacing:-3px}.nav .muted{display:none}}
</style>
</head>
<body>
<nav><div class="wrap nav"><a class="logo" href="#/">CLASS <b>TEN_ELEVEN</b></a><div id="navRight"></div></div></nav>

<div id="app"></div>

<footer><div class="wrap">© 2026 CLASS TEN_ELEVEN • X-11</div></footer>

<script>
const $=s=>document.querySelector(s), app=$("#app");
let site=null, me=null, token=localStorage.getItem("x11_token");
async function api(url,opt={}){opt.headers={...(opt.headers||{}), "Content-Type":"application/json"};if(token)opt.headers.Authorization="Bearer "+token;const r=await fetch(url,opt);const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Terjadi kesalahan");return d}
async function boot(){site=await api("/api/site");if(token){try{me=(await api("/api/me")).user}catch{token=null;localStorage.removeItem("x11_token")}}render()}
function nav(){navRight.innerHTML=me?`<span class="muted">${me.name}</span> <button onclick="logout()">keluar</button>`:`<a class="btn primary" href="#/login">login</a>`}
function render(){
 nav(); const hash=location.hash;
 if(!me){if(hash==="#/register")return register();return login()}
 if(me.role==="admin" && hash==="#/admin")return adminPage();
 return home();
}
function login(){
 app.innerHTML=`<main class="auth"><div class="authbox"><span class="pill">X-11 PORTAL</span><h2>masuk ke kelas.</h2><p class="muted">login sebagai siswa atau admin.</p><label>Email</label><input id="email" type="email" placeholder="nama@email.com"><label>Password</label><input id="pass" type="password" placeholder="minimal 8 karakter"><div id="msg" class="err"></div><button class="primary" onclick="doLogin()">masuk</button> <a class="btn" href="#/register">buat akun</a><p class="muted" style="font-size:12px;margin-top:18px">akun admin awal tersedia di README.</p></div></main>`
}
function register(){
 app.innerHTML=`<main class="auth"><div class="authbox"><span class="pill">SISWA X-11</span><h2>buat akun.</h2><p class="muted">akun ini untuk masuk ke portal kelas.</p><label>Nama</label><input id="name" placeholder="Nama lengkap"><label>Email</label><input id="email" type="email" placeholder="nama@email.com"><label>Password</label><input id="pass" type="password" placeholder="minimal 8 karakter"><div id="msg" class="err"></div><button class="primary" onclick="doRegister()">daftar</button> <a class="btn" href="#/login">kembali</a></div></main>`
}
async function doRegister(){try{await api("/api/register",{method:"POST",body:JSON.stringify({name:name.value,email:email.value,password:pass.value})});location.hash="#/login";alert("akun berhasil dibuat. silakan login.")}catch(e){msg.textContent=e.message}}
async function doLogin(){try{const d=await api("/api/login",{method:"POST",body:JSON.stringify({email:email.value,password:pass.value})});token=d.token;me=d.user;localStorage.setItem("x11_token",token);location.hash=me.role==="admin"?"#/admin":"#/";render()}catch(e){msg.textContent=e.message}}
async function logout(){await api("/api/logout",{method:"POST"}).catch(()=>{});token=null;me=null;localStorage.removeItem("x11_token");location.hash="#/login";render()}
function home(){
 const s=site.settings;
 app.innerHTML=`<main><section class="hero wrap"><span class="pill">${s.subtitle}</span><h1>${s.className.replace(" ","<br>")}<span>.</span></h1><p>${s.description}</p><div class="actions" style="margin-top:25px">${me.role==="admin"?'<a class="btn primary" href="#/admin">buka admin panel →</a>':''}</div></section>
 <section class="wrap"><div class="sectiontop"><div><span class="pill">ABOUT</span><h2>lebih dari sekadar kelas.</h2></div><p class="muted">${s.motto}</p></div><div class="grid"><div class="card"><h3>⚡ solid</h3><p>saling bantu, saling dukung, dan tetap satu tim.</p></div><div class="card"><h3>🎯 growth</h3><p>bertumbuh lewat belajar, organisasi, dan pengalaman.</p></div><div class="card"><h3>📸 memories</h3><p>setiap kegiatan jadi cerita yang bisa dikenang.</p></div></div></section>
 <section class="wrap"><div class="sectiontop"><h2>pengumuman.</h2></div>${(site.announcements||[]).map(x=>`<div class="card" style="margin-bottom:10px"><h3>${x.title}</h3><p>${x.body}</p></div>`).join("")}</section>
 <section class="wrap"><div class="sectiontop"><h2>jadwal.</h2></div><div class="table"><table><thead><tr><th>Hari</th><th>Jam</th><th>Pelajaran</th></tr></thead><tbody>${site.schedule.map(x=>`<tr><td>${x.day}</td><td>${x.time}</td><td>${x.subject}</td></tr>`).join("")}</tbody></table></div></section>
 <section class="wrap"><div class="sectiontop"><h2>gallery.</h2></div><div class="gallery">${(site.gallery||[]).length?site.gallery.map(x=>`<figure><img src="${x.url}" alt="${x.caption}" loading="lazy"><figcaption class="muted">${x.caption}</figcaption></figure>`).join(""):'<div class="card">belum ada foto.</div>'}</div></section></main>`
}
function adminPage(){
 app.innerHTML=`<main class="wrap"><span class="pill">ADMIN PANEL</span><h2>kendali website.</h2><p class="muted">edit konten portal X-11 dari satu tempat.</p><div class="tabs"><button class="active" onclick="tab('site',this)">website</button><button onclick="tab('news',this)">pengumuman</button><button onclick="tab('jadwal',this)">jadwal</button><button onclick="tab('gallery',this)">gallery</button><button onclick="tab('users',this)">siswa</button></div><div id="panel"></div></main>`;tab("site",document.querySelector(".tabs button"))
}
function tab(type,btn){document.querySelectorAll(".tabs button").forEach(x=>x.classList.remove("active"));btn.classList.add("active");const p=$("#panel");
 if(type==="site")p.innerHTML=`<div class="card"><h3>identitas website</h3><label>Nama kelas</label><input id="sn" value="${site.settings.className}"><label>Subtitle</label><input id="ss" value="${site.settings.subtitle}"><label>Motto</label><input id="sm" value="${site.settings.motto}"><label>Deskripsi</label><textarea id="sd">${site.settings.description}</textarea><button class="primary" onclick="saveSite()">simpan perubahan</button></div>`;
 if(type==="news")p.innerHTML=`<div class="card"><h3>tambah pengumuman</h3><input id="nt" placeholder="Judul"><textarea id="nb" placeholder="Isi pengumuman"></textarea><button class="primary" onclick="addNews()">terbitkan</button></div><br>${site.announcements.map(x=>`<div class="card row"><div><b>${x.title}</b><p class="muted">${x.body}</p></div><button class="danger" onclick="delNews(${x.id})">hapus</button></div>`).join("")}`;
 if(type==="jadwal")p.innerHTML=`<div class="card"><h3>edit jadwal</h3>${site.schedule.map((x,i)=>`<div class="grid" style="grid-template-columns:1fr 1fr 2fr;margin-bottom:8px"><input id="d${i}" value="${x.day}"><input id="t${i}" value="${x.time}"><input id="s${i}" value="${x.subject}"></div>`).join("")}<button class="primary" onclick="saveSchedule()">simpan jadwal</button></div>`;
 if(type==="gallery")p.innerHTML=`<div class="card"><h3>tambah foto via URL</h3><input id="gu" placeholder="https://.../foto.jpg"><input id="gc" placeholder="Caption"><button class="primary" onclick="addGallery()">tambah</button></div><br>${(site.gallery||[]).map(x=>`<div class="card row"><span>${x.caption||x.url}</span><button class="danger" onclick="delGallery(${x.id})">hapus</button></div>`).join("")}`;
 if(type==="users")loadUsers();
}
async function refresh(){site=await api("/api/site");adminPage()}
async function saveSite(){await api("/api/settings",{method:"PUT",body:JSON.stringify({className:sn.value,subtitle:ss.value,motto:sm.value,description:sd.value})});await refresh()}
async function addNews(){await api("/api/announcements",{method:"POST",body:JSON.stringify({title:nt.value,body:nb.value})});await refresh()}
async function delNews(id){if(confirm("hapus pengumuman?")){await api("/api/announcements/"+id,{method:"DELETE"});await refresh()}}
async function saveSchedule(){const schedule=site.schedule.map((_,i)=>({day:document.getElementById("d"+i).value,time:document.getElementById("t"+i).value,subject:document.getElementById("s"+i).value}));await api("/api/schedule",{method:"PUT",body:JSON.stringify({schedule})});await refresh()}
async function addGallery(){await api("/api/gallery",{method:"POST",body:JSON.stringify({url:gu.value,caption:gc.value})});await refresh()}
async function delGallery(id){if(confirm("hapus foto?")){await api("/api/gallery/"+id,{method:"DELETE"});await refresh()}}
async function loadUsers(){const users=await api("/api/users");panel.innerHTML=users.map(u=>`<div class="card row" style="margin-bottom:8px"><div><b>${u.name}</b><div class="muted">${u.email} • ${u.role}</div></div>${u.role==="student"?`<button class="danger" onclick="delUser('${u.id}')">hapus</button>`:"<span class='pill'>ADMIN</span>"}</div>`).join("")}
async function delUser(id){if(confirm("hapus akun siswa?")){await api("/api/users/"+id,{method:"DELETE"});loadUsers()}}
window.addEventListener("hashchange",render);boot();
</script>
</body></html>
